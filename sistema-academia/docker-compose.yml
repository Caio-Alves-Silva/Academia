version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: academia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academia_db
      MYSQL_USER: academia
      MYSQL_PASSWORD: academia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u academia -pacademia || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - academia-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academia-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/academia_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DB_USER: academia
      DB_PASSWORD: academia
      JWT_SECRET: segredo-super-seguro-com-mais-de-32-caracteres-producao
      APP_TIMEZONE: America/Sao_Paulo
      SEED_DEMO_DATA: "true"
      SEED_SENHA_RECEPCAO: Recepcao@123
      SEED_SENHA_INSTRUTOR: Instrutor@123
      SEED_SENHA_ALUNO: Aluno@1234
    networks:
      - academia-net

volumes:
  mysql_data:

networks:
  academia-net:
    driver: bridge
