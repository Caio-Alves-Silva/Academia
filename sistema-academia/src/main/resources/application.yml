spring:
  application:
    name: sistema-academia
  datasource:
    # Em Docker as variáveis vêm do docker-compose.
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/academia_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
    username: ${DB_USER:academia}
    password: ${DB_PASSWORD:academia}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # O schema é gerido pelo Flyway (db/migration); o Hibernate apenas valida o mapeamento.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# --- JWT (o segredo precisa ter no mínimo 32 caracteres; troque em produção) ---
app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789}
    expiracao: ${JWT_EXPIRACAO:PT2H}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Carga inicial complementar ao Flyway (aulas e aluno de demonstração; usuários e planos vêm do V2)
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
    senha-recepcao: ${SEED_SENHA_RECEPCAO:Recepcao@123}
    senha-instrutor: ${SEED_SENHA_INSTRUTOR:Instrutor@123}
    senha-aluno: ${SEED_SENHA_ALUNO:Aluno@1234}

# --- Swagger / OpenAPI ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha