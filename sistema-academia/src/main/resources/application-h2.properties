# Perfil "h2": executa a API sem MySQL (banco em memória). Uso: -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:academia;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop