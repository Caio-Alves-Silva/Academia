spring.application.name=sistema-academia
server.port=${PORT:8080}

# --- Banco de dados (MySQL). Em Docker as variáveis vêm do docker-compose. ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academia?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:academia}
spring.datasource.password=${DB_PASSWORD:academia}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT (o segredo precisa ter no mínimo 32 caracteres; troque em produção) ---
app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-0123456789}
app.jwt.expiracao=${JWT_EXPIRACAO:PT2H}

# --- Aplicação ---
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Carga inicial (recepção e instrutores sempre; planos, aulas e aluno de demonstração se demo-data=true) ---
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.senha-recepcao=${SEED_SENHA_RECEPCAO:Recepcao@123}
app.seed.senha-instrutor=${SEED_SENHA_INSTRUTOR:Instrutor@123}
app.seed.senha-aluno=${SEED_SENHA_ALUNO:Aluno@1234}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha