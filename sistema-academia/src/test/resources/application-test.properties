# Cada contexto de teste usa seu próprio banco H2 em memória (nome aleatório) para que contextos em cache não se atropelem.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=segredo-de-teste-com-mais-de-32-caracteres-xyz
app.seed.demo-data=false
logging.level.org.springframework.security=WARN